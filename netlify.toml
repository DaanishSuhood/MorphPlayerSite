# A static site: no build step. Netlify serves public/ as it is.
[build]
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    # Everything comes from this site, except the download buttons' look at GitHub's latest releases.
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://api.github.com; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Short cache for the page and its files, so an edit shows up within the hour.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
